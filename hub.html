</style></head><body><header><b>QUOTE HUB</b><small>Every job, trade and version · read-only</small></header><main>
<section id="login" class="card"><h1>Quote hub</h1><form id="loginForm"><label for="username">Name or email</label><input type="text" name="username" id="username" autocomplete="username" placeholder="e.g. Aaron - Yardspace"><label>ADMIN code<input id="code" type="password" name="password" autocomplete="current-password"></label><p><button type="submit">Open hub</button></p></form><p id="loginErr" class="err" role="status"></p></section>
<div id="app" hidden><section class="card"><h1>Quotes by job</h1><p>📥 Opened · 🧮 Drafting · 📤 Sent</p><div class="hub-tools"><button id="refresh">Refresh</button><label><input id="live" type="checkbox" checked>Live</label><small id="updated" class="mut" role="status"></small></div><div id="notices" aria-live="polite"></div><p id="hubMsg" role="status"></p><div id="jobs"></div><button id="more" hidden>More jobs</button></section>
<section class="card" id="versionPanel" hidden><button class="ghost back-to-jobs">Back to jobs</button><h2 id="tradeTitle"></h2><div id="versions"></div></section>
<section id="proposalPanel" class="card" hidden><div class="preview-tools"><button class="ghost back-to-jobs">Back to jobs</button><h2 id="previewTitle">Proposal preview</h2><p><button id="printQuote" disabled>Final quote (PDF)</button></p><p id="printReason"></p></div><dl class="meas" id="meas"></dl><div id="preview"></div></section></div></main>
<script src="proposal.js"></script>
<script>
// Pinned to the database's region (Singapore): about 3x faster than the nearest edge.
const FN = 'https://irwdvwlsnpxqcadpfzxt.supabase.co/functions/v1/vh-quote?forceFunctionRegion=ap-southeast-1';
const $ = (id) => document.getElementById(id);
const money = (v) => '$' + (Math.round(v * 100) / 100).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const n = (v) => { if (v == null || v === '') return 0; const cleaned = String(v).replace(/[$,%\s]/g, ''); if (!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(cleaned)) throw new Error('Enter a non-negative number'); const x = Number(cleaned); if (!Number.isFinite(x)) throw new Error('Invalid number'); return x; };
const r2 = (v) => Math.round(v * 100) / 100;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let CODE='',job=null,state=null,nextOffset=null,selectedCode=null,selection=0;
async function call(action,extra={}){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:CODE,action,...extra})});const body=await r.json();if(!r.ok)throw new Error(body.error||'Request failed');return body;}
// BEGIN PRICING CONTRACT (keep identical in page, function and tests)
function roundMoney(v) { return Math.round((v + Number.EPSILON) * 100) / 100; }
function numberValue(v, name, max = 1000000, nullable = false) {
  if (nullable && v == null) return null;
  if (typeof v !== 'number' || !Number.isFinite(v) || v < 0 || v > max) throw new Error(name + ': invalid number');
  return v;
}
function marginValue(v) { numberValue(v, 'margin', Number.MAX_VALUE); return Math.min(90, v); }
function linePrice(l, p) {
  const cost = p.delivery_mode === 'internal' ? l.hours * p.labour_rate + l.materials_ex : l.contractor_ex;
  const margin = marginValue(l.margin_pct == null ? p.margin_pct : l.margin_pct);
  const price = l.price_override == null ? cost / (1 - margin / 100) : l.price_override;
  return { cost: roundMoney(cost), margin, price: roundMoney(price) };
}
function quotePrice(p) {
  const parts = p.lines.filter(l => l.included).map(l => ({ label: l.id + ' ' + l.item, ...linePrice(l, p) }));
  for (const [label, cost] of [['Setup', p.setup_ex || 0], ['Contingency', p.contingency_ex]]) parts.push({ label, cost, price: roundMoney(cost / (1 - marginValue(p.margin_pct) / 100)) });
  const ex = roundMoney(parts.reduce((s, x) => s + x.price, 0));
  const cost = roundMoney(parts.reduce((s, x) => s + x.cost, 0));
  const gst = p.gst_registered ? roundMoney(ex * .1) : 0;
  return { parts, cost, ex, gst, inc: roundMoney(ex + gst) };
}
function optionPrices(p) {
  const total = quotePrice(p), sections = p.sections || [];
  const base = sections.map(s => roundMoney(p.lines.filter(l => l.included && s.line_ids.includes(l.id)).reduce((v, l) => v + linePrice(l, p).price, 0)));
  const sum = base.reduce((a, b) => a + b, 0); let used = 0, taxUsed = 0, baseUsed = 0;
  // Allocate setup and contingency pro rata by line price; final option absorbs cent rounding.
  return base.map((b, i) => {
    const last = i === base.length - 1;
    baseUsed += b;
    const target = sum ? roundMoney(total.ex * baseUsed / sum) : roundMoney(total.ex * (i + 1) / base.length);
    const ex = last ? roundMoney(total.ex - used) : roundMoney(target - used);
    const taxTarget = p.gst_registered ? roundMoney((used + ex) * .1) : 0;
    const gst = last ? roundMoney(total.gst - taxUsed) : roundMoney(taxTarget - taxUsed);
    used = roundMoney(used + ex); taxUsed = roundMoney(taxUsed + gst);
    return { ex, gst, inc: roundMoney(ex + gst) };
  });
}
function validateQuote(p) {
  const str = (v, name, max) => { if (typeof v !== 'string' || v.length > max) throw new Error(name + ': invalid text'); };
  const list = (v, name, max = 100) => { if (!Array.isArray(v) || v.length > max) throw new Error(name + ': invalid list'); };
  if (!p || !['internal', 'contractor'].includes(p.delivery_mode)) throw new Error('Invalid delivery mode');
  for (const k of ['gst_registered', 'site_visit_needed']) if (typeof p[k] !== 'boolean') throw new Error(k + ': invalid boolean');
  numberValue(p.labour_rate, 'labour_rate'); numberValue(p.margin_pct, 'margin_pct', 90);
  numberValue(p.setup_ex, 'setup', 1000000, true); numberValue(p.contingency_ex, 'contingency'); numberValue(p.days_on_site, 'days', 100000, true);
  numberValue(p.custom_counter, 'custom counter', Number.MAX_SAFE_INTEGER);
  if (!Number.isInteger(p.custom_counter)) throw new Error('Invalid custom counter');
  for (const [k, max] of [['letter', 5000], ['notes', 2000], ['prepared_by', 80], ['earliest_start', 10]]) str(p[k], k, max);
  for (const k of ['assumptions', 'exclusions', 'questions']) { list(p[k], k); p[k].forEach(v => str(v, k, 1000)); }
  list(p.lines, 'lines'); const ids = new Set();
  p.lines.forEach(l => {
    str(l.id, 'id', 32); if (!l.id || ids.has(l.id)) throw new Error('Duplicate or empty line id'); ids.add(l.id);
    for (const [k, max] of [['item', 200], ['scope', 1000], ['unit', 20], ['notes', 1000]]) str(l[k], k, max);
    if (typeof l.included !== 'boolean' || typeof l.custom !== 'boolean') throw new Error('Invalid line boolean');
    numberValue(l.qty, 'qty', 100000); numberValue(l.hours, 'hours', 1000);
    for (const k of ['materials_ex', 'contractor_ex']) numberValue(l[k], k);
    numberValue(l.margin_pct, 'line margin', 90, true); numberValue(l.price_override, 'price override', 1000000, true);
    for (const k of ['cost_ex', 'amount_ex', 'rate_ex']) if (l[k] !== undefined) numberValue(l[k], k, Number.MAX_VALUE);
    if (l.price_override != null && (l.hours || l.materials_ex || l.contractor_ex)) throw new Error('Price override requires no cost inputs');
  });
  list(p.sections, 'sections', 12); const assigned = new Set();
  p.sections.forEach(s => {
    str(s.name, 'option name', 200); str(s.description, 'option description', 1000);
    if (!['Required', 'Recommended', 'Optional'].includes(s.tag)) throw new Error('Invalid option tag');
    list(s.points, 'points', 100); s.points.forEach(v => str(v, 'point', 1000)); list(s.line_ids, 'option lines');
    s.line_ids.forEach(id => { if (!ids.has(id) || assigned.has(id)) throw new Error('Unknown or duplicate option line'); assigned.add(id); });
  });
  return p;
}
function completionProblems(p) {
  const errors = [];
  if (!p.lines.some(l => l.included)) errors.push('Include at least one priced line');
  p.lines.forEach(l => { if (l.included && (!(l.qty > 0) || !(linePrice(l, p).price > 0))) errors.push(l.id + ': enter quantity and price');
    if (l.included && p.sections.filter(s => s.line_ids.includes(l.id)).length !== 1) errors.push(l.id + ': choose one option'); });
  if (p.setup_ex == null) errors.push('Answer setup cost (0 is allowed)');
  if (!(p.days_on_site > 0)) errors.push('Enter days on site greater than 0');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(p.earliest_start) || !Number.isFinite(Date.parse(p.earliest_start)) || new Date(p.earliest_start).toISOString().slice(0, 10) !== p.earliest_start) errors.push('Enter a valid start date');
  return errors;
}
// END PRICING CONTRACT
// BEGIN NULLABLE ANSWERS (v3 arithmetic stays unchanged; unanswered is not zero)
const validateAnsweredQuote = validateQuote, answeredCompletionProblems = completionProblems, answeredMarginValue = marginValue;
marginValue = v => answeredMarginValue(v == null ? 0 : v);
validateQuote = p => { validateAnsweredQuote({...p, labour_rate:p.labour_rate === null ? 0 : p.labour_rate, margin_pct:p.margin_pct === null ? 0 : p.margin_pct}); return p; };
completionProblems = p => {
  const errors = answeredCompletionProblems(p);
  if (p.delivery_mode === 'internal' && !(p.labour_rate > 0)) errors.push('Enter labour cost per hour greater than 0');
  if (p.margin_pct == null) errors.push('Answer margin (type 0 for no margin)');
  return errors;
};
// END NULLABLE ANSWERS
function numericState(){return state;}
function renderPreview() {
  const p=numericState();
  if(!document.head){$('preview').innerHTML=proposalText(p,job,'');return;}
  layoutProposal($('preview'),p,job);
}

function statusGlyph(c){return c.status==='submitted'?'📤 Sent':c.version?'🧮 Drafting':c.last_used_at?'📥 Opened':'Not opened';}
let loadedJobs=[],loadedPages=1,snapshot=new Map(),notices=[],noticeId=0,listBusy=false,refreshAgain=false,liveTimer=null,signedIn=false;
const timelines=new Map();
const brisbane=(value,seconds=false,timeOnly=false)=>new Date(value).toLocaleString('en-AU',{timeZone:'Australia/Brisbane',...(timeOnly?{}:{day:'numeric',month:'short'}),hour:'numeric',minute:'2-digit',...(seconds?{second:'2-digit',hour12:false}:{hour12:true})});
function presence(value){if(!value)return 'Not opened yet';const age=Math.max(0,(Date.now()-Date.parse(value))/60000);return age<5?'🟢 On the page now':age<60?'🟡 Seen '+Math.floor(age)+' min ago':'Last seen '+brisbane(value);}
function keepScroll(fn){const x=window.scrollX,y=window.scrollY;fn();window.scrollTo(x,y);}
function renderNotices(){$('notices').innerHTML=notices.map(n=>`<div class="notice"><span>${esc(n.text)}</span><button class="ghost" data-dismiss="${esc(n.id)}" aria-label="Dismiss notice">×</button></div>`).join('');}
function trackChanges(jobs){const changes=[];for(const j of jobs)for(const c of j.codes){const old=snapshot.get(c.id);if(old){const newer=Number(c.version)>Number(old.version)||Number(c.version_count)>Number(old.version_count)||c.version&&(c.created_at!==old.created_at||c.status!==old.status);if(newer||c.last_used_at&&c.last_used_at!==old.last_used_at){const text=newer?(c.status==='submitted'?'📤 '+c.trade_name+' sent the quote':c.trade_name+' saved v'+c.version)+' · '+money(c.total_ex)+' ex GST':c.trade_name+' opened the page';const at=newer?c.created_at:c.last_used_at;changes.push({id:++noticeId,at:Date.parse(at)||Date.now(),text:text+' · '+brisbane(at,false,true)});}}snapshot.set(c.id,{...c});}notices=[...changes,...notices].sort((a,b)=>b.at-a.at||b.id-a.id).slice(0,5);}
function activityHtml(t){if(t.error)return `<p class="err">${esc(t.error)}</p>`;if(!t.versions)return '<p class="mut">Loading activity…</p>';return '<ol class="activity">'+t.versions.map(v=>`<li>${esc(brisbane(v.created_at))} · v${esc(v.version)} · ${esc(v.status==='submitted'?'📤 Sent quote':'Draft')} · ${esc(money(v.total_ex))} ex GST <span class="mut">${esc(v.source)}</span></li>`).join('')+'</ol>'+(t.versions.length?'':'<p class="mut">No activity yet.</p>');}
function renderJobs(){keepScroll(()=>{$('jobs').innerHTML=loadedJobs.map(j=>`<section><h2>${esc(j.title)}</h2><p>${esc(j.site)} · ${esc(j.status)} · ${esc(j.id)}</p><div class="hub-scroll"><table class="hub-table"><thead><tr><th>Trade</th><th>Progress</th><th>Access</th><th>Latest quote</th></tr></thead><tbody>${j.codes.map(c=>{const t=timelines.get(c.id);return `<tr><td>${esc(c.trade_name)}<div class="presence">${esc(presence(c.last_used_at))}</div><button class="ghost" data-activity="${esc(c.id)}" aria-expanded="${esc(!!t)}">Activity</button></td><td>${esc(statusGlyph(c))}<br>${esc(c.version_count)} versions</td><td>${esc(c.revoked?'Revoked':'Expires '+brisbane(c.expires_at))}</td><td>${c.version?`v${esc(c.version)} · ${esc(money(c.total_ex))}<br>${esc(brisbane(c.created_at))}`:'No quote'}<br><button class="ghost" data-code="${esc(c.id)}" data-trade="${esc(c.trade_name)}"${Number(c.version_count)?'':' disabled'}>Versions (${esc(c.version_count)})</button></td></tr>${t?`<tr><td colspan="4"><div data-timeline="${esc(c.id)}">${activityHtml(t)}</div></td></tr>`:''}`;}).join('')}</tbody></table></div></section>`).join('')||'No jobs.';renderNotices();$('more').hidden=nextOffset===null;});}
async function loadActivity(c){const t=timelines.get(c.id);if(!t)return;const request={};t.request=request;const marker={count:c.version_count,used:c.last_used_at};try{const r=await call('hub_versions',{code_id:c.id});if(timelines.get(c.id)!==t||t.request!==request)return;t.versions=r.versions;t.error='';t.marker=marker;}catch(e){if(timelines.get(c.id)!==t||t.request!==request)return;t.error=e.message;}keepScroll(()=>{for(const el of $('jobs').querySelectorAll('[data-timeline]'))if(el.dataset.timeline===c.id)el.innerHTML=activityHtml(t);});}
function scheduleLive(){clearTimeout(liveTimer);if(signedIn&&$('live').checked&&!document.hidden)liveTimer=setTimeout(()=>run(()=>listJobs()),20000);}
async function listJobs(append=false){
  if(listBusy){if(!append)refreshAgain=true;return;}if(append&&nextOffset===null)return;listBusy=true;clearTimeout(liveTimer);$('more').disabled=true;
  try{let jobs=[],offset=append?nextOffset:0,pages=0,next=null;const wanted=append?1:loadedPages;
    do{const r=await call('hub_list',{offset});jobs.push(...r.jobs);next=r.next_offset;pages++;offset=next;}while(next!==null&&pages<wanted);
    trackChanges(jobs);loadedJobs=append?[...loadedJobs,...jobs]:jobs;loadedPages=append?loadedPages+pages:pages;nextOffset=next;renderJobs();$('updated').textContent='Updated '+brisbane(Date.now(),true,true);
    if($('live').checked&&!document.hidden)await Promise.all(loadedJobs.flatMap(j=>j.codes).filter(c=>{const t=timelines.get(c.id);return t&&(!t.marker||t.marker.count!==c.version_count||t.marker.used!==c.last_used_at);}).map(loadActivity));
  }finally{listBusy=false;$('more').disabled=false;if(refreshAgain&&signedIn&&!document.hidden){refreshAgain=false;run(()=>listJobs());}else{refreshAgain=false;scheduleLive();}}
}
async function run(fn){try{$('hubMsg').textContent='';await fn();}catch(e){$('hubMsg').textContent=e.message;}}
try{$('username').value=localStorage.getItem('tq-hub-username')||'';}catch{}
$('username').addEventListener('input',()=>{try{localStorage.setItem('tq-hub-username',$('username').value);}catch{}});
// Same-document back navigation leaves the signed-in view in place.
$('loginForm').onsubmit=async e=>{e.preventDefault();CODE=$('code').value.trim();try{localStorage.setItem('tq-hub-username',$('username').value);}catch{}try{await listJobs();$('login').hidden=true;$('app').hidden=false;signedIn=true;history.pushState({signedIn:true},'',location.pathname+location.search+'#signed-in');scheduleLive();}catch(error){$('loginErr').textContent=error.message;}};
$('refresh').onclick=()=>run(()=>listJobs());$('more').onclick=()=>run(()=>listJobs(true));
$('live').onchange=()=>{scheduleLive();if($('live').checked&&signedIn&&!document.hidden)run(()=>listJobs());};
document.addEventListener('visibilitychange',()=>{scheduleLive();if(!document.hidden&&signedIn&&$('live').checked)run(()=>listJobs());});
$('notices').onclick=e=>{const id=e.target.dataset.dismiss;if(id)keepScroll(()=>{notices=notices.filter(n=>String(n.id)!==id);renderNotices();});};
$('jobs').onclick=e=>{const d=e.target.dataset;if(d.activity){if(timelines.has(d.activity)){timelines.delete(d.activity);renderJobs();}else{const c=loadedJobs.flatMap(j=>j.codes).find(c=>c.id===d.activity);if(c){timelines.set(c.id,{});renderJobs();run(()=>loadActivity(c));}}return;}if(!d.code)return;run(async()=>{const request=++selection;selectedCode=d.code;$('proposalPanel').hidden=true;$('printQuote').disabled=true;const r=await call('hub_versions',{code_id:d.code});if(request!==selection)return;$('tradeTitle').textContent=d.trade;$('versionPanel').hidden=false;$('versions').innerHTML=r.versions.map(v=>`<div class="version-row">v${esc(v.version)} · ${v.status==='submitted'?'📤 Sent':'🧮 Draft'} · ${esc(money(v.total_ex))} · ${esc(new Date(v.created_at).toLocaleString('en-AU'))}<button data-version="${esc(v.version)}">Open preview</button></div>`).join('')||'No versions.';$('versionPanel').scrollIntoView({behavior:'smooth',block:'start'});});};
$('versions').onclick=e=>{const version=+e.target.dataset.version;if(!version)return;run(async()=>{const request=++selection;const r=await call('hub_version',{code_id:selectedCode,version});if(request!==selection)return;job=r.job;state=r.quote.payload;$('meas').innerHTML=(Array.isArray(job.measurements)?job.measurements:[]).filter(m=>m&&m.what).map(m=>`<dt>${esc(m.what)}</dt><dd>${esc(m.size)}</dd>`).join('');$('proposalPanel').hidden=false;renderPreview();$('proposalPanel').hidden=false;$('previewTitle').textContent=r.trade+' · v'+r.quote.version+' · '+(r.quote.status==='submitted'?'Sent':'Draft');const problems=completionProblems(state);$('printQuote').disabled=!!problems.length;$('printReason').textContent=problems.length?'Incomplete draft: '+problems.join('; '):'Choose Save as PDF in the print dialog.';$('proposalPanel').scrollIntoView({behavior:'smooth',block:'start'});});};
document.querySelectorAll('.back-to-jobs').forEach(b=>b.onclick=()=>$('jobs').scrollIntoView({behavior:'smooth',block:'start'}));
$('printQuote').onclick=()=>{if(state&&!completionProblems(state).length)window.print();};
</script></body></html>
