<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,"><title>Quote hub</title><style>
:root{--or:#1f2933;--or2:#eef0f2;--ink:#1f2933;--mut:#52606d;--line:#e4e7eb;--bg:#f6f7f8;--ok:#2f6f3e}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Arial,Helvetica,sans-serif}
header{background:var(--or);color:#fff;padding:14px max(16px,env(safe-area-inset-left))}header b{font-size:18px;letter-spacing:.06em}
header small{display:block;opacity:.9}
main{max-width:1200px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}.mut{color:var(--mut)}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.route{border:2px solid var(--line);border-radius:10px;padding:12px}.route b{color:var(--or)}
button{background:var(--or);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:14px}
button.ghost{background:#fff;color:var(--or);border:2px solid var(--or)}
input,textarea,select{font:inherit;border:1px solid #cbd2d9;border-radius:6px;padding:6px 8px;width:100%;background:#fff;color:var(--ink)}
.seg{display:inline-flex;border:2px solid var(--or);border-radius:8px;overflow:hidden}.seg button{border-radius:0;background:#fff;color:var(--or)}.seg button.on{background:var(--or);color:#fff}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:980px}th,td{border-bottom:1px solid var(--line);padding:8px 5px;vertical-align:top;text-align:left}
th{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}td.r,th.r{text-align:right}
td.num input{width:78px;text-align:right}.sc{font-size:12.5px;color:var(--mut);margin-top:3px;max-width:320px}
.thumbs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:54px;height:40px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:pointer}
tr.off td{opacity:.45}tr.off td:first-child{opacity:1}.per{font-size:11.5px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.sum div{background:var(--bg);border-radius:8px;padding:10px}.sum small{display:block;color:var(--mut);font-size:12px}.sum b{font-size:20px}
.totals{display:flex;gap:24px;flex-wrap:wrap;align-items:center}.donut{width:150px;height:150px}
.legend div{display:flex;gap:6px;align-items:center;font-size:13px;margin:2px 0}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--or);padding:10px max(16px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:5}
.chip{font-size:12px;padding:3px 8px;border-radius:20px;background:var(--or2);color:var(--or)}.chip.ok{background:#eef5ef;color:var(--ok)}
.prog{display:flex;align-items:center;gap:6px;font-size:13px}.pbar{width:110px;height:8px;background:var(--line);border-radius:6px;overflow:hidden;display:inline-block}.pbar i{display:block;height:100%;width:0;background:var(--or)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal img{max-width:100%;max-height:85vh;border-radius:8px}.modal p{color:#fff;text-align:center}
.confirm{background:var(--or2);border:2px solid var(--or);border-radius:10px;padding:12px;margin-bottom:14px}
#login{max-width:420px;margin:60px auto}.err{color:#b42318;margin-top:8px}

button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{font-size:16px}
@media print{body{background:white}body>header,#login,#app>*:not(#proposalPanel),#proposalPanel>.preview-tools{display:none!important}main{padding:0;max-width:none}#app,#proposalPanel{display:block!important;margin:0;padding:0;border:0}}
.version-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px;border-bottom:1px solid #ddd}

.hub-table{min-width:0}.hub-table td{overflow-wrap:anywhere}.hub-scroll{overflow-x:auto}
@media(max-width:700px){.hub-table th:nth-child(3),.hub-table td:nth-child(3){display:none}}
.meas{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 18px;margin:0 0 12px}.meas dt{color:var(--mut);font-size:13px}.meas dd{margin:0;font-weight:700}
</style></head><body><header><b>QUOTE HUB</b><small>Every job, trade and version · read-only</small></header><main>
<section id="login" class="card"><h1>Quote hub</h1><form id="loginForm"><label>ADMIN code<input id="code" type="password" autocomplete="off"></label><p><button>Open hub</button></p></form><p id="loginErr" class="err" role="status"></p></section>
<div id="app" hidden><section class="card"><h1>Quotes by job</h1><p>📥 Opened · 🧮 Drafting · 📤 Sent</p><button id="refresh">Refresh</button><p id="hubMsg" role="status"></p><div id="jobs"></div><button id="more" hidden>More jobs</button></section>
<section class="card" id="versionPanel" hidden><h2 id="tradeTitle"></h2><div id="versions"></div></section>
<section id="proposalPanel" class="card" hidden><div class="preview-tools"><h2 id="previewTitle">Proposal preview</h2><p><button id="printQuote" disabled>Final quote (PDF)</button></p><p id="printReason"></p></div><dl class="meas" id="meas"></dl><div id="preview"></div></section></div></main>
<script src="proposal.js"></script>
<script>
// Pinned to the database's region (Singapore): about 3x faster than the nearest edge.
const FN = 'https://irwdvwlsnpxqcadpfzxt.supabase.co/functions/v1/vh-quote?forceFunctionRegion=ap-southeast-1';
const $ = (id) => document.getElementById(id);
const money = (v) => '$' + (Math.round(v * 100) / 100).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const n = (v) => { if (v == null || v === '') return 0; const cleaned = String(v).replace(/[$,%\s]/g, ''); if (!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(cleaned)) throw new Error('Enter a non-negative number'); const x = Number(cleaned); if (!Number.isFinite(x)) throw new Error('Invalid number'); return x; };
const r2 = (v) => Math.round(v * 100) / 100;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let CODE='',job=null,state=null,nextOffset=null,selectedCode=null,selection=0;
async function call(action,extra={}){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:CODE,action,...extra})});const body=await r.json();if(!r.ok)throw new Error(body.error||'Request failed');return body;}
// BEGIN PRICING CONTRACT (keep identical in page, function and tests)
function roundMoney(v) { return Math.round((v + Number.EPSILON) * 100) / 100; }
function numberValue(v, name, max = 1000000, nullable = false) {
  if (nullable && v == null) return null;
  if (typeof v !== 'number' || !Number.isFinite(v) || v < 0 || v > max) throw new Error(name + ': invalid number');
  return v;
}
function marginValue(v) { numberValue(v, 'margin', Number.MAX_VALUE); return Math.min(90, v); }
function linePrice(l, p) {
  const cost = p.delivery_mode === 'internal' ? l.hours * p.labour_rate + l.materials_ex : l.contractor_ex;
  const margin = marginValue(l.margin_pct == null ? p.margin_pct : l.margin_pct);
  const price = l.price_override == null ? cost / (1 - margin / 100) : l.price_override;
  return { cost: roundMoney(cost), margin, price: roundMoney(price) };
}
function quotePrice(p) {
  const parts = p.lines.filter(l => l.included).map(l => ({ label: l.id + ' ' + l.item, ...linePrice(l, p) }));
  for (const [label, cost] of [['Setup', p.setup_ex || 0], ['Contingency', p.contingency_ex]]) parts.push({ label, cost, price: roundMoney(cost / (1 - marginValue(p.margin_pct) / 100)) });
  const ex = roundMoney(parts.reduce((s, x) => s + x.price, 0));
  const cost = roundMoney(parts.reduce((s, x) => s + x.cost, 0));
  const gst = p.gst_registered ? roundMoney(ex * .1) : 0;
  return { parts, cost, ex, gst, inc: roundMoney(ex + gst) };
}
function optionPrices(p) {
  const total = quotePrice(p), sections = p.sections || [];
  const base = sections.map(s => roundMoney(p.lines.filter(l => l.included && s.line_ids.includes(l.id)).reduce((v, l) => v + linePrice(l, p).price, 0)));
  const sum = base.reduce((a, b) => a + b, 0); let used = 0, taxUsed = 0, baseUsed = 0;
  // Allocate setup and contingency pro rata by line price; final option absorbs cent rounding.
  return base.map((b, i) => {
    const last = i === base.length - 1;
    baseUsed += b;
    const target = sum ? roundMoney(total.ex * baseUsed / sum) : roundMoney(total.ex * (i + 1) / base.length);
    const ex = last ? roundMoney(total.ex - used) : roundMoney(target - used);
    const taxTarget = p.gst_registered ? roundMoney((used + ex) * .1) : 0;
    const gst = last ? roundMoney(total.gst - taxUsed) : roundMoney(taxTarget - taxUsed);
    used = roundMoney(used + ex); taxUsed = roundMoney(taxUsed + gst);
    return { ex, gst, inc: roundMoney(ex + gst) };
  });
}
function validateQuote(p) {
  const str = (v, name, max) => { if (typeof v !== 'string' || v.length > max) throw new Error(name + ': invalid text'); };
  const list = (v, name, max = 100) => { if (!Array.isArray(v) || v.length > max) throw new Error(name + ': invalid list'); };
  if (!p || !['internal', 'contractor'].includes(p.delivery_mode)) throw new Error('Invalid delivery mode');
  for (const k of ['gst_registered', 'site_visit_needed']) if (typeof p[k] !== 'boolean') throw new Error(k + ': invalid boolean');
  numberValue(p.labour_rate, 'labour_rate'); numberValue(p.margin_pct, 'margin_pct', 90);
  numberValue(p.setup_ex, 'setup', 1000000, true); numberValue(p.contingency_ex, 'contingency'); numberValue(p.days_on_site, 'days', 100000, true);
  numberValue(p.custom_counter, 'custom counter', Number.MAX_SAFE_INTEGER);
  if (!Number.isInteger(p.custom_counter)) throw new Error('Invalid custom counter');
  for (const [k, max] of [['letter', 5000], ['notes', 2000], ['prepared_by', 80], ['earliest_start', 10]]) str(p[k], k, max);
  for (const k of ['assumptions', 'exclusions', 'questions']) { list(p[k], k); p[k].forEach(v => str(v, k, 1000)); }
  list(p.lines, 'lines'); const ids = new Set();
  p.lines.forEach(l => {
    str(l.id, 'id', 32); if (!l.id || ids.has(l.id)) throw new Error('Duplicate or empty line id'); ids.add(l.id);
    for (const [k, max] of [['item', 200], ['scope', 1000], ['unit', 20], ['notes', 1000]]) str(l[k], k, max);
    if (typeof l.included !== 'boolean' || typeof l.custom !== 'boolean') throw new Error('Invalid line boolean');
    numberValue(l.qty, 'qty', 100000); numberValue(l.hours, 'hours', 1000);
    for (const k of ['materials_ex', 'contractor_ex']) numberValue(l[k], k);
    numberValue(l.margin_pct, 'line margin', 90, true); numberValue(l.price_override, 'price override', 1000000, true);
    for (const k of ['cost_ex', 'amount_ex', 'rate_ex']) if (l[k] !== undefined) numberValue(l[k], k, Number.MAX_VALUE);
    if (l.price_override != null && (l.hours || l.materials_ex || l.contractor_ex)) throw new Error('Price override requires no cost inputs');
  });
  list(p.sections, 'sections', 12); const assigned = new Set();
  p.sections.forEach(s => {
    str(s.name, 'option name', 200); str(s.description, 'option description', 1000);
    if (!['Required', 'Recommended', 'Optional'].includes(s.tag)) throw new Error('Invalid option tag');
    list(s.points, 'points', 100); s.points.forEach(v => str(v, 'point', 1000)); list(s.line_ids, 'option lines');
    s.line_ids.forEach(id => { if (!ids.has(id) || assigned.has(id)) throw new Error('Unknown or duplicate option line'); assigned.add(id); });
  });
  return p;
}
function completionProblems(p) {
  const errors = [];
  if (!p.lines.some(l => l.included)) errors.push('Include at least one priced line');
  p.lines.forEach(l => { if (l.included && (!(l.qty > 0) || !(linePrice(l, p).price > 0))) errors.push(l.id + ': enter quantity and price');
    if (l.included && p.sections.filter(s => s.line_ids.includes(l.id)).length !== 1) errors.push(l.id + ': choose one option'); });
  if (p.setup_ex == null) errors.push('Answer setup cost (0 is allowed)');
  if (!(p.days_on_site > 0)) errors.push('Enter days on site greater than 0');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(p.earliest_start) || !Number.isFinite(Date.parse(p.earliest_start)) || new Date(p.earliest_start).toISOString().slice(0, 10) !== p.earliest_start) errors.push('Enter a valid start date');
  return errors;
}
// END PRICING CONTRACT
// BEGIN NULLABLE ANSWERS (v3 arithmetic stays unchanged; unanswered is not zero)
const validateAnsweredQuote = validateQuote, answeredCompletionProblems = completionProblems, answeredMarginValue = marginValue;
marginValue = v => answeredMarginValue(v == null ? 0 : v);
validateQuote = p => { validateAnsweredQuote({...p, labour_rate:p.labour_rate === null ? 0 : p.labour_rate, margin_pct:p.margin_pct === null ? 0 : p.margin_pct}); return p; };
completionProblems = p => {
  const errors = answeredCompletionProblems(p);
  if (p.delivery_mode === 'internal' && !(p.labour_rate > 0)) errors.push('Enter labour cost per hour greater than 0');
  if (p.margin_pct == null) errors.push('Answer margin (type 0 for no margin)');
  return errors;
};
// END NULLABLE ANSWERS
function numericState(){return state;}
function renderPreview() {
  const p=numericState();
  if(!document.head){$('preview').innerHTML=proposalText(p,job,'');return;}
  layoutProposal($('preview'),p,job);
}

function statusGlyph(c){return c.status==='submitted'?'📤 Sent':c.version?'🧮 Drafting':c.last_used_at?'📥 Opened':'Not opened';}
async function listJobs(append=false){const r=await call('hub_list',{offset:append?nextOffset:0});const html=r.jobs.map(j=>`<section><h2>${esc(j.title)}</h2><p>${esc(j.site)} · ${esc(j.status)} · ${esc(j.id)}</p><div class="hub-scroll"><table class="hub-table"><thead><tr><th>Trade</th><th>Progress</th><th>Access</th><th>Latest quote</th></tr></thead><tbody>${j.codes.map(c=>`<tr><td>${esc(c.trade_name)}</td><td>${statusGlyph(c)}<br>${c.version_count} versions</td><td>${c.revoked?'Revoked':'Expires '+esc(new Date(c.expires_at).toLocaleString('en-AU'))}<br>Last opened: ${c.last_used_at?esc(new Date(c.last_used_at).toLocaleString('en-AU')):'Never'}</td><td>${c.version?`v${c.version} · ${money(c.total_ex)}<br>${esc(new Date(c.created_at).toLocaleString('en-AU'))}`:'No quote'}<br><button class="ghost" data-code="${esc(c.id)}" data-trade="${esc(c.trade_name)}">Versions</button></td></tr>`).join('')}</tbody></table></div></section>`).join('');if(append)$('jobs').innerHTML+=html;else $('jobs').innerHTML=html||'No jobs.';nextOffset=r.next_offset;$('more').hidden=nextOffset===null;}
async function run(fn){try{$('hubMsg').textContent='';await fn();}catch(e){$('hubMsg').textContent=e.message;}}
$('loginForm').onsubmit=async e=>{e.preventDefault();CODE=$('code').value.trim();try{await listJobs();$('code').value='';$('login').hidden=true;$('app').hidden=false;}catch(error){$('loginErr').textContent=error.message;}};
$('refresh').onclick=()=>run(()=>listJobs());$('more').onclick=()=>run(()=>listJobs(true));
$('jobs').onclick=e=>{const d=e.target.dataset;if(!d.code)return;run(async()=>{const request=++selection;selectedCode=d.code;$('proposalPanel').hidden=true;$('printQuote').disabled=true;const r=await call('hub_versions',{code_id:d.code});if(request!==selection)return;$('tradeTitle').textContent=d.trade;$('versionPanel').hidden=false;$('versions').innerHTML=r.versions.map(v=>`<div class="version-row">v${v.version} · ${v.status==='submitted'?'📤 Sent':'🧮 Draft'} · ${money(v.total_ex)} · ${esc(new Date(v.created_at).toLocaleString('en-AU'))}<button data-version="${v.version}">Open preview</button></div>`).join('')||'No versions.';});};
$('versions').onclick=e=>{const version=+e.target.dataset.version;if(!version)return;run(async()=>{const request=++selection;const r=await call('hub_version',{code_id:selectedCode,version});if(request!==selection)return;job=r.job;state=r.quote.payload;$('meas').innerHTML=(Array.isArray(job.measurements)?job.measurements:[]).filter(m=>m&&m.what).map(m=>`<dt>${esc(m.what)}</dt><dd>${esc(m.size)}</dd>`).join('');$('proposalPanel').hidden=false;renderPreview();$('proposalPanel').hidden=false;$('previewTitle').textContent=r.trade+' · v'+r.quote.version+' · '+(r.quote.status==='submitted'?'Sent':'Draft');const problems=completionProblems(state);$('printQuote').disabled=!!problems.length;$('printReason').textContent=problems.length?'Incomplete draft: '+problems.join('; '):'Choose Save as PDF in the print dialog.';});};
$('printQuote').onclick=()=>{if(state&&!completionProblems(state).length)window.print();};
</script></body></html>
